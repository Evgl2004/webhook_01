# Секция events определяет параметры обработки соединений
events {
    # Максимальное количество одновременных соединений на worker процесс
    worker_connections 1024;
}

# Основная секция HTTP, содержит все настройки для HTTP-трафика
http {
    # Подключаем файл с MIME-типами (соответствие расширений файлов и их типов)
    include /etc/nginx/mime.types;

    # Подключение карты User-Agent
    include /etc/nginx/conf.d/block_user_agents.map;

    # MIME-тип по умолчанию для случаев, когда тип файла не определен
    default_type application/octet-stream;

    # Включаем оптимизацию отправки файлов через системный вызов sendfile
    # Это ускоряет передачу статических файлов
    sendfile on;

    # Включаем оптимизацию для уменьшения количества пакетов при отправке
    # Накопление данных перед отправкой (улучшает производительность)
    tcp_nopush on;

    # Отключаем алгоритм Нейгла для уменьшения задержек
    # Данные отправляются сразу, не дожидаясь накопления
    tcp_nodelay on;

    # Таймаут keep-alive соединений в секундах
    # Как долго поддерживать открытое соединение для последующих запросов
    keepalive_timeout 65;

    # Определяем зоны для ограничения частоты запросов для webhook
    # 10 запросов в секунду с каждого IP
    # 10MB память для хранения данных о запросах
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/s;
    # Определяем зоны для ограничения частоты запросов для health
    # 30 запросов в минуту
    limit_req_zone $binary_remote_addr zone=health:10m rate=30r/m;
    # Ограничение количества соединений с одного IP для всего сервиса
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    # Определяем зоны для ограничения частоты запросов для Flower
    # 30 запросов в минуту
    limit_req_zone $binary_remote_addr zone=flower:10m rate=30r/m;
    # Определяем зоны для ограничения частоты запросов для внутренних API
    limit_req_zone $binary_remote_addr zone=internal_api:10m rate=30r/m;
    # Публичные переходы: отдельная граница на один IP и на весь виртуальный хост.
    limit_req_zone $binary_remote_addr zone=tracked_link_per_ip:10m rate=120r/m;
    limit_req_zone $server_name zone=tracked_link_global:1m rate=200r/s;
    limit_conn_zone $binary_remote_addr zone=tracked_link_connections:10m;

    # Из корректного токена извлекаются только первые 10 символов для диагностики.
    # Полный URI, аргументы запроса и полный токен в безопасный журнал не попадают.
    map $request_uri $tracked_link_marker {
        default "-";
        "~^/r/v1/(?<tracked_link_marker_value>[A-Za-z0-9_-]{10})[A-Za-z0-9_-]{22}(?:\?|$)" $tracked_link_marker_value;
    }

    log_format tracked_link_safe 'scope=tracked_link time=$time_iso8601 '
                                 'link_marker=$tracked_link_marker '
                                 'remote_addr=$remote_addr status=$status method=$request_method '
                                 'request_time=$request_time upstream_time=$upstream_response_time '
                                 'limit_req=$limit_req_status limit_conn=$limit_conn_status';

    # Блок server определяет виртуальный хост

    # Блок для перенаправления HTTP на HTTPS
    server {
        # Порт, который слушает nginx
        listen 80;
        # Имя сервера (домен). _ означает "любой домен"
        server_name sagur.24vds.ru www.sagur.24vds.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Основной блок для HTTPS
    server {
        # Порт, который слушает nginx
        # После получения SLL сертификата раскомментировать.
        listen 443 ssl;

        # Имя сервера (домен). _ означает "любой домен"
        server_name sagur.24vds.ru www.sagur.24vds.ru;

        # Пути к SSL-сертификатам (будут получены via Let's Encrypt)
        # После получения SLL сертификата раскомментировать.
        ssl_certificate /etc/letsencrypt/live/sagur.24vds.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sagur.24vds.ru/privkey.pem;

        # Безопасные настройки SSL
        # Подключаем файл с рекомендуемыми настройками
        include /etc/nginx/options-ssl-nginx.conf;

        # Параметры безопасности
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Дополнительные улучшения 1
        # Скрывает версию nginx
        server_tokens off;

        # Дополнительные улучшения 2
        # Улучшенная защита от DDoS
        client_body_timeout 10;
        client_header_timeout 10;
        reset_timedout_connection on;

        # Дополнительные улучшения 3
        # Ограничение количества соединений с одного IP
        limit_conn addr 100;

        # Базовые security headers для всего сервера
        # Запрет MIME-sniffing
        add_header X-Content-Type-Options nosniff always;
        # Запрет встраивания в iframe
        add_header X-Frame-Options DENY always;
        # Защита от XSS
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:;" always;

        # Путь к файлу логов доступа (все входящие запросы)
        access_log /var/log/nginx/access.log;

        # Путь к файлу логов ошибок
        error_log /var/log/nginx/error.log;

        # Максимальный размер тела запроса от клиента
        # Защита от переполнения памяти большими файлами
        client_max_body_size 10M;

        # Публичные маршруты переходов расположены перед общими регулярными запретами:
        # Nginx выбирает первое совпавшее регулярное выражение по порядку в файле.

        # Рабочий публичный переход по точному непрозрачному токену.
        location ~ "^/r/v1/[A-Za-z0-9_-]{32}$" {
            # Преобразуем внутренний запрет Nginx в утверждённый внешний ответ 405.
            error_page 403 = @tracked_link_method_not_allowed;
            # Неканонический исходный URI получает ту же нейтральную заглушку 410.
            error_page 410 = @tracked_link_gone;

            # Location проверяет нормализованный URI, поэтому отдельно проверяем исходный URI.
            if ($request_uri !~ "^/r/v1/[A-Za-z0-9_-]{32}$") {
                return 410;
            }

            limit_except GET {
                deny all;
            }

            limit_req zone=tracked_link_per_ip burst=30 nodelay;
            limit_req zone=tracked_link_global burst=400 nodelay;
            limit_req_status 429;
            limit_conn tracked_link_connections 10;
            limit_conn_status 429;

            client_max_body_size 1k;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_pass http://redirect-bonus:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_send_timeout 2s;
            proxy_read_timeout 5s;

            # Nginx задаёт единый набор защитных заголовков без дублей от приложения.
            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Robots-Tag;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Strict-Transport-Security;
            add_header Cache-Control "no-store, private" always;
            add_header Pragma "no-cache" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            # Безопасный журнал уходит в stdout и ротируется драйвером Docker.
            access_log /dev/stdout tracked_link_safe;
            # Стандартный error_log раскрывает полный URI, поэтому для публичного токена отключён.
            error_log /dev/null;
        }

        # Запрещённые методы не достигают Gunicorn, но получают корректный Allow.
        location @tracked_link_method_not_allowed {
            internal;

            add_header Allow "GET, HEAD" always;
            add_header Cache-Control "no-store, private" always;
            add_header Pragma "no-cache" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            access_log /dev/stdout tracked_link_safe;
            error_log /dev/null;
            return 405;
        }

        # Неверные и устаревшие варианты публичного пути ограничиваются до ответа 410.
        # Этот блок должен идти после точного регулярного выражения рабочего маршрута.
        location ~ "^/r(?:/|$)" {
            error_page 403 = @tracked_link_gone;

            limit_req zone=tracked_link_per_ip burst=30 nodelay;
            limit_req zone=tracked_link_global burst=400 nodelay;
            limit_req_status 429;
            limit_conn tracked_link_connections 10;
            limit_conn_status 429;

            add_header Cache-Control "no-store, private" always;
            add_header Pragma "no-cache" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            access_log /dev/stdout tracked_link_safe;
            error_log /dev/null;

            # access-модуль выполняется после ограничителей и запускает нейтральный ответ ниже.
            deny all;
        }

        # Единая нейтральная заглушка для неверных и устаревших ссылочных путей.
        location @tracked_link_gone {
            internal;
            default_type text/plain;
            charset utf-8;

            add_header Cache-Control "no-store, private" always;
            add_header Pragma "no-cache" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            access_log /dev/stdout tracked_link_safe;
            error_log /dev/null;
            return 410 "Ссылка недоступна.";
        }

        # Запрещаем доступ к скрытым файлам
        location ~* /\.(git|htaccess|htpasswd|svn|env) {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # Запрещаем доступ к служебным файлам Django
        location ~ /(README\.md|requirements\.txt|composer\.json|package\.json|web\.config|dockerfile) {
            deny all;
            return 404;
        }

        location ~* (\.php|\.asp|\.aspx|\.pl|\.cgi|\.sh|\.bak|\.save|\.old)$ {
            deny all;
            return 404;
        }

        # Блокировка сканеров уязвимостей
        location ~* /(cgi-bin|luci|wp-admin|phpMyAdmin) {
            deny all;
            access_log off;
            log_not_found off;
            return 444;
        }

        # Дополнительная блокировка опасных путей (если хотите усилить защиту)
        location ~* (aws-secret|phpinfo|actuator|\.bak|\.save|\.old) {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # Блокировка нестандартных методов
        if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$ ) {
            return 444;
        }

        # Дополнительная блокировка опасных методов
        if ($request_method ~* ^(CONNECT|TRACE|TRACK|DEBUG)$ ) {
            return 444;
        }

        # Блокировка по User-Agent
        # Может блокировать легитимные инструменты.

        # Применение условия блокировки
        if ($blocked_agent) {
            return 444; # Закрывает соединение без ответа
        }

        # Блокирует Referer, начинающийся с протокола и валидного IPv4-адреса.
        if ($http_referer ~* "^https?://(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?::[0-9]+)?/") {
            return 444;
        }

        # ========== РАЗДЕЛ ДЛЯ WEBHOOK SERVICE (app-wh:8000) ==========

        # 1. webhooks - публичный
        # Входящие уведомления
        location /webhooks/ {

            # БЛОКИРУЕМ опасные Content-Type
            if ($content_type ~* "multipart/form-data") {
                access_log /var/log/nginx/webhooks_blocked.log;
                return 415 "Unsupported Media Type";
            }

            # ПЕРЕДАЕМ оригинальный Content-Type
            proxy_set_header Content-Type $content_type;

            # Ограничение размера тела запроса для webhook
            client_max_body_size 1M;

            # Ограничение rate limiting для webhook (защита от спама)
            # Burst до 50 запросов - временное превышение лимита
            limit_req zone=webhook burst=20 nodelay;

            # Проксирование на Django приложение
            proxy_pass http://app-wh:8000;

            # Стандартные proxy заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты для webhook (можно увеличить при необходимости)
            proxy_connect_timeout 15s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;

            # Отключаем кэширование для webhook запросов
            # Отключаем буферизацию для real-time webhook
            proxy_buffering off;
            # Отключаем кэширование для динамических данных
            proxy_cache off;

            # Логирование webhook запросов в отдельный файл (опционально)
            access_log /var/log/nginx/webhooks_access.log;
            error_log /var/log/nginx/webhooks_error.log;
        }

        # 2. Health check - публичный
        # Локация для проверки состояния сервиса
        location /health {
            # Ограничение размера тела запроса
            client_max_body_size 1K;

            # Rate limiting - 30 запросов в минуту с burst до 10
            limit_req zone=health burst=10 nodelay;

            # Проксирование запросов к Django приложению
            proxy_pass http://app-wh:8000;

            # Передаем оригинальный Host заголовок
            proxy_set_header Host $host;

            # Передаем реальный IP клиента
            proxy_set_header X-Real-IP $remote_addr;

            # Передаем цепочку прокси (если есть)
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Передаем оригинальный протокол (http/https)
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймаут подключения к бэкенду для health-check
            proxy_connect_timeout 2s;

            # Таймаут отправки данных для health-check
            proxy_send_timeout 2s;

            # Таймаут чтения ответа от бэкенда для health-check
            proxy_read_timeout 3s;

            # Минимальное логирование (только ошибки)
            access_log /var/log/nginx/health_access.log;
            error_log /var/log/nginx/health_error.log;
        }

        # 3. Внутренние API webhook service - только для внутреннего использования
        location /api/internal/ {

            # Добавлена проверка IP
            allow 10.20.0.0/16; # Docker сеть
            deny all;

            # Проксирование к Webhook service
            proxy_pass http://app-wh:8000;

            # Proxy заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;

            # Логирование
            access_log /var/log/nginx/internal_api_access.log;
            error_log /var/log/nginx/internal_api_error.log;
        }

        # 4. API аутентификации (токены) - публичный, но с ограничениями
        location /api/token/ {

            # Добавлена проверка IP
            allow 10.20.0.0/16; # Docker сеть
            deny all;

            # Проксирование к Webhook service
            proxy_pass http://app-wh:8000;

            # Proxy заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 10s;

            # Логирование
            access_log /var/log/nginx/auth_access.log;
            error_log /var/log/nginx/auth_error.log;
        }

        # 5. Админка Webhook service по новому пути
        location /admin_wh/ {
            # Rate limiting для админки
            limit_req zone=internal_api burst=10 nodelay;

            # Можно ограничить доступ по IP
            # allow 10.0.0.0/8;
            # allow 172.16.0.0/12;
            # allow 192.168.0.0/16;
            # deny all;

            # Проксирование к Webhook service
            # Важно: передаем с тем же путем, так как в Django админка будет настроена на /admin/
            proxy_pass http://app-wh:8000/admin_wh/;

            # Для корректной работы админки с измененным путем нужно настроить редиректы
#             proxy_redirect http://app-wh:8000/admin/ /admin_wh/;
#             proxy_redirect https://app-wh:8000/admin/ /admin_wh/;

            # Proxy заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Замена ссылок в HTML для корректной работы админки
#             sub_filter 'action="/admin/' 'action="/admin_wh/';
#             sub_filter 'href="/admin/' 'href="/admin_wh/';
#             sub_filter 'src="/admin/' 'src="/admin_wh/';
            sub_filter '/static/admin/' '/admin_wh_static/';
            sub_filter_once off;

            # Таймауты
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Логирование
            access_log /var/log/nginx/admin_wh_access.log;
            error_log /var/log/nginx/admin_wh_error.log;
        }

        # 6. Статика админки Webhook service
        location /admin_wh_static/ {
            # Проксирование статики админки Webhook service
            proxy_pass http://app-wh:8000/static/admin/;

            # Долгое кэширование
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;

            # Proxy заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 7. Статика Webhook service
        location /static/webhook/ {
            # Путь к статике Webhook service внутри контейнера nginx
            alias /app/static/webhook/;

            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
            access_log off;
            log_not_found off;
        }

        # 8. Медиа файлы Webhook service (если требуется)
        location /media/webhook/ {
            # Путь к медиа файлам Webhook service внутри контейнера nginx
            alias /app/media/webhook/;

            expires 1y;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options nosniff;
            access_log off;
            log_not_found off;
        }

         # ========== РАЗДЕЛ ДЛЯ LOYALTY SERVICE (app_loyalty_service:8001) ==========

        # Основная админка (loyalty service) - по стандартному пути
        location /admin/ {
            # Rate limiting для админки
            limit_req zone=internal_api burst=10 nodelay;

            # Добавлена проверка IP
            allow 10.20.0.0/16; # Docker сеть
            include /etc/nginx/private/admin.allow.conf;
            deny all;

            # Проксирование к Loyalty service
            proxy_pass http://app-bonus:8001;

            # Proxy заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Логирование
            access_log /var/log/nginx/admin_access.log;
            error_log /var/log/nginx/admin_error.log;
        }

        # Статика Loyalty service (с учетом настроек Django)
        location  /static/loyalty/ {
            # Путь к директории со статическими файлами внутри контейнера nginx
            alias /app/static/loyalty/;

            # Время кэширования в браузере (1 год)
            expires 1y;

            # Директивы кэширования для браузера
            # public - можно кэшировать прокси-серверам
            # immutable - файлы не изменятся, можно кэшировать надолго
            add_header Cache-Control "public, immutable";

            # Security headers для статики
            add_header X-Content-Type-Options nosniff;
        }

        # Медиа файлы Loyalty service (с учетом настроек Django, загруженные пользователями)
        location /media/loyalty/ {
            # Путь к директории с медиа-файлами
            alias /app/media/loyalty/;

            # Время кэширования в браузере
            expires 1y;

            # Директивы кэширования
            add_header Cache-Control "public";

            # Security headers для статики
            add_header X-Content-Type-Options nosniff;
        }

        # 9. Callback vtelemax -> Loyalty service: событие регистрации гостя
        # Принимает только POST-события welcome-регистрации от сервера vtelemax.
        # Основной сайт и интерфейсы остаются закрыты общим location / ниже.
        location = /internal/integration/v1/vtelemax/registration-events {
            # Разрешаем только фактический внешний IP сервера vtelemax.
            include /etc/nginx/private/vtelemax.allow.conf;
            deny all;

            # Разрешён только POST, остальные методы запрещены.
            limit_except POST {
                deny all;
            }

            # Ограничиваем размер тела callback, чтобы не принимать лишние большие payload.
            client_max_body_size 64k;

            # Проксируем запрос в Loyalty service.
            proxy_pass http://app-bonus:8001;

            # Стандартные proxy-заголовки.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Тайм-ауты callback-запроса.
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;

            # Отдельные логи для диагностики welcome-callback.
            access_log /var/log/nginx/vtelemax_registration_access.log;
            error_log /var/log/nginx/vtelemax_registration_error.log;
        }

        # 10. Callback vtelemax -> Loyalty service: пакет событий взаимодействия с сообщениями
        # Принимает только POST-пакеты нажатий от сервера vtelemax.
        # Основной сайт и интерфейсы остаются закрыты общим location / ниже.
        location = /internal/integration/v1/vtelemax/message-interactions/events {
            # Разрешаем только фактический внешний IP сервера vtelemax.
            include /etc/nginx/private/vtelemax.allow.conf;
            deny all;

            # Разрешён только POST, остальные методы запрещены.
            limit_except POST {
                deny all;
            }

            # Предел отправителя vtelemax для одного пакета составляет 65 536 байт.
            client_max_body_size 64k;

            # Проксируем запрос в Loyalty service без изменения пути.
            proxy_pass http://app-bonus:8001;

            # Стандартные proxy-заголовки, включая признак исходного HTTPS.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Тайм-ауты пакетного callback-запроса.
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;

            # Отдельные журналы для сквозной диагностики взаимодействий.
            access_log /var/log/nginx/vtelemax_message_interactions_access.log;
            error_log /var/log/nginx/vtelemax_message_interactions_error.log;
        }

        location /flower/ {
            # Rate limiting для Flower
            limit_req zone=flower burst=10 nodelay;
            limit_conn addr 5;

            # Важно: слеш в конце
            proxy_pass http://flower:5555/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Исправление путей
            sub_filter '/static/' '/flower-static/';
            sub_filter 'src="/' 'src="/flower/';
            sub_filter 'href="/' 'href="/flower/';
            sub_filter 'action="/' 'action="/flower/';
            sub_filter_once off;

            proxy_buffering on;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Статика Flower
        location /flower-static/ {
            proxy_pass http://flower:5555/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
        }

        # Блокируем прямой доступ к файлам /agreement.html и /notifications.html
        # location ~ ^/(agreement|notifications)\.html$ {
        location ~ ^/(mailing-consent-(max|tg|vk)|personal-data-consent-(max|tg|vk)|privacy-policy-(max|tg|vk))\.html$ {
            # Возвращаем 404 для любых попыток обратиться к поддиректориям
            # (например, /agreement.html/anything)
            return 404;
        }

        # Основная локация для /agreement/ и /notifications/ - публикации об использовании сервиса
        #location ~ ^/(agreement|notifications)/ {
         location ~ ^/(?<doc_type>mailing-consent|personal-data-consent|privacy-policy)/(?<channel>max|tg|vk)/?$ {

            root /var/www/sagur_project;
            try_files /docs/${doc_type}-${channel}.html =404;

            # Указываем путь к директории, где лежит agreement.html
            #alias /var/www/sagur_project/docs/;
            # Ищем внутри этой директории файл agreement.html
            #try_files agreement.html =404;
            # $1 подставит имя (agreement или notifications) из регулярного выражения
            #try_files $1.html =404;

            # Разрешены только GET и HEAD (даже POST, PUT и т.д. запрещены)
            limit_except GET HEAD {
                deny all;
            }

            # Запрещаем листинг директории (на случай, если кто-то попытается обратиться к /agreement/)
            autoindex off;

            # Жёстко ограничиваем размер запроса (для GET не критично, но на всякий случай)
            client_max_body_size 1k;

            # ─────────────────────────────────────────────────────────────
            # Security Headers – все необходимые, потому что вложенный location
            # переопределяет заголовки из server (add_header не наследуются)
            # ─────────────────────────────────────────────────────────────
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            # Content-Security-Policy: максимально строгий – только сам документ,
            # без внешних ресурсов (даже inline-стили и скрипты запрещены,
            # если они не прописаны в самом файле как unsafe-inline)
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self';" always;

            # Запрет индексации поисковиками (юридические документы часто не нужно индексировать)
            add_header X-Robots-Tag "noindex, nofollow" always;

            # Отключаем использование MIME-сниффинга (уже есть в X-Content-Type-Options)
            # Запрещаем кэширование на прокси (чтобы изменения в документе сразу были видны)
            add_header Cache-Control "no-store, max-age=0" always;
            expires off;

            # Убираем ETag и Last-Modified, чтобы не давать лишней информации о версии
            etag off;
            if_modified_since off;
            add_header Last-Modified "";

            # Предлагаем браузеру отображать содержимое, а не скачивать
            add_header Content-Disposition "inline" always;

            # ─────────────────────────────────────────────────────────────
            # Логирование
            # ─────────────────────────────────────────────────────────────
            access_log off;
            # только ошибки уровня warn и выше
            error_log /var/log/nginx/agreement_error.log warn;

            # ─────────────────────────────────────────────────────────────
            # Дополнительные проверки
            # ─────────────────────────────────────────────────────────────
            # Запрещаем любые попытки выполнения скриптов, если вдруг файл будет переинтерпретирован
            location ~ \.php$ {
                deny all;
                return 404;
            }
        }

        # Основная локация - все остальные запросы
        location / {

            # Добавлена проверка IP
            allow 10.20.0.0/16; # Docker сеть
            include /etc/nginx/private/venues.allow.conf;
            deny all;

            # Проксирование всех запросов к Django приложению
            proxy_pass http://app-bonus:8001;

            # Передаем оригинальный Host заголовок
            proxy_set_header Host $host;

            # Передаем реальный IP клиента
            proxy_set_header X-Real-IP $remote_addr;

            # Передаем цепочку прокси (для правильного определения IP)
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Передаем оригинальный протокол
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймаут установки соединения с бэкендом
            proxy_connect_timeout 30s;

            # Таймаут отправки данных бэкенду
            proxy_send_timeout 30s;

            # Таймаут чтения ответа от бэкенда
            proxy_read_timeout 30s;
        }
    }
}
